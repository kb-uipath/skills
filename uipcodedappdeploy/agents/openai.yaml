interface:
  display_name: "UiPath Coded App Deploy"
  short_description: "Governed, recovery, testing, or fast POC app deploy"
  default_prompt: "Use $uipcodedappdeploy to classify this request as governed v2.3 release, exact v1.3 recovery, explicit synthetic-only Alpha/Staging testing, or an explicitly requested fast Web/Action POC deployment. Keep governed plan-hash approval as the default; accept v1.2 only as a recursively verified predecessor; require current-command Production and customer-data flags for the POC lane, never retry an indeterminate write, and never treat testing or POC evidence as release evidence."
